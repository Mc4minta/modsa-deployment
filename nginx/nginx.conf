user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Suppress Nginx version disclosure in headers and error pages
    server_tokens off;

    # Logging format including real client IP, request time, and upstream response time
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_cf_connecting_ip" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Real Client IP Resolution
    # Trust CF-Connecting-IP ONLY from within the private Docker bridge network
    # (cloudflared container operating within subnet 172.28.0.0/16).
    # -------------------------------------------------------------------------
    set_real_ip_from 172.28.0.0/16;
    real_ip_header CF-Connecting-IP;

    # -------------------------------------------------------------------------
    # Rate Limiting Configuration
    # Tuneable parameters:
    # 1. chat_ip: Per-IP limit of 10 requests/minute with a burst of 5.
    # 2. chat_global: Global concurrency ceiling of 60 requests/minute with burst of 20
    #    to prevent exhausting backend LLM/embedding API rate and token quotas.
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=chat_ip:10m rate=10r/m;
    limit_req_zone $server_name zone=chat_global:10m rate=60r/m;
    limit_req_status 429;

    # Upstream backend service definition
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Conservative Security Headers
        # Note on CSP: Content-Security-Policy is deliberately not enforced here
        # to avoid breaking react-markdown dynamic DOM rendering and Vite runtime chunks.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        root /usr/share/nginx/html;

        # JSON-friendly error responses for API callers and client frontend
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"detail":"Too many requests. Please try again later."}';
        }

        error_page 502 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 502 '{"detail":"Bad gateway: backend service is currently unreachable or timed out."}';
        }

        # Lightweight healthcheck for Nginx container itself (not proxied)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # -------------------------------------------------------------------------
        # Backend API Routing (Strict Allowlist)
        # ONLY /api/health and /api/chat/ask are exposed publicly.
        # All other /api/* routes (e.g. /api/admin/reindex, /api/docs) return 404.
        # -------------------------------------------------------------------------

        # GET /api/health -> backend /health
        location = /api/health {
            limit_except GET {
                deny all;
            }

            proxy_pass http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # POST /api/chat/ask -> backend /chat/ask
        location = /api/chat/ask {
            limit_except POST {
                deny all;
            }

            # Enforce rate limits
            limit_req zone=chat_ip burst=5 nodelay;
            limit_req zone=chat_global burst=20 nodelay;

            # Body size limit: question max length is 1500 chars. In UTF-8 (Thai characters
            # are up to 3 bytes/char), 1500 chars + JSON wrapper <= 6KB.
            # 16k is a conservative ceiling preventing body flooding attacks.
            client_max_body_size 16k;

            proxy_pass http://backend_upstream/chat/ask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cloudflare's edge timeout is roughly 100 seconds.
            # Worst-case backend latency is roughly (LLM_TIMEOUT x (LLM_MAX_RETRIES + 1)) + embedding latency.
            # With default LLM_TIMEOUT=30 and LLM_MAX_RETRIES=2, 30s * 3 = 90s plus retries/embedding can exceed 100s.
            # proxy_read_timeout is set to 95s to cleanly fail before the Cloudflare edge closes the connection.
            proxy_connect_timeout 10s;
            proxy_read_timeout 95s;
            proxy_send_timeout 95s;
            proxy_buffering on;
        }

        # Block all other /api paths (including /api/admin/reindex, /api/docs, /api/openapi.json)
        location /api/ {
            return 404;
        }

        # -------------------------------------------------------------------------
        # Static Assets & SPA Client-Side Routing
        # -------------------------------------------------------------------------

        # Long-term immutable caching for hashed static assets generated by Vite
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            access_log off;
        }

        # index.html must never be cached so browsers immediately receive new build chunk hashes
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # All other paths serve the React single-page app
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
