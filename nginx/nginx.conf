user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    # Rate policy:
    # Chat per-IP: 30r/m, burst 10, nodelay
    # Global chat: 60r/m, burst 20, nodelay
    # Health per-IP: 60r/m, burst 20
    # OPTIONS maps to an empty key and is free.

    limit_req_status 429;

    limit_req_zone $chat_client_key zone=chat_per_ip:10m rate=30r/m;
    limit_req_zone $chat_global_key zone=chat_global:10m rate=60r/m;
    limit_req_zone $health_client_key zone=health_per_ip:10m rate=60r/m;

    map $request_method $chat_client_key {
        default $binary_remote_addr;
        OPTIONS "";
    }

    map $request_method $chat_global_key {
        default "all-chat";
        OPTIONS "";
    }

    map $request_method $health_client_key {
        default $binary_remote_addr;
        OPTIONS "";
    }

    # Detailed access logging for latency and timeout diagnosis.
    log_format modsa
        '$remote_addr '
        'forwarded="$http_x_forwarded_for" '
        'method=$request_method '
        'uri="$request_uri" '
        'status=$status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time '
        'upstream_status=$upstream_status '
        'bytes_sent=$bytes_sent '
        'request_length=$request_length';

    access_log /var/log/nginx/access.log modsa;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_tokens off;
        root /usr/share/nginx/html;

        client_max_body_size 16k;

        # General upstream timeout settings.
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;

        proxy_intercept_errors on;

        # TODO(owner): confirm the trusted proxy range. It depends on how
        # production traffic reaches this container and where TLS terminates;
        # compose publishes no port for nginx. Wrong value = every client
        # shares one rate-limit key, or X-Forwarded-For can be spoofed.
        set_real_ip_from 172.28.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        add_header X-Content-Type-Options nosniff always;

        # --------------------------------------------------
        # Nginx internal health check
        # --------------------------------------------------

        location = /nginx-health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # --------------------------------------------------
        # Backend health endpoint
        # --------------------------------------------------

        location = /api/health {
            if ($request_method !~ ^(GET|OPTIONS)$) {
                return 404;
            }

            limit_req zone=health_per_ip burst=20 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://backend:8000/health;
        }

        # --------------------------------------------------
        # Chat endpoint
        # --------------------------------------------------

        location = /api/chat/ask {
            if ($request_method !~ ^(POST|OPTIONS)$) {
                return 404;
            }

            limit_req zone=chat_per_ip burst=10 nodelay;
            limit_req zone=chat_global burst=20 nodelay;

            # Explicit timeout settings for long-running LLM requests.
            proxy_connect_timeout 10s;
            proxy_send_timeout 150s;
            proxy_read_timeout 150s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://backend:8000/chat/ask;
        }

        # --------------------------------------------------
        # Unknown API paths: JSON 404, never the SPA document
        # --------------------------------------------------

        location ^~ /api/ {
            return 404;
        }

        # --------------------------------------------------
        # Static frontend (built into the image)
        # add_header in a location drops server-level add_header lines,
        # so nosniff is repeated in each.
        # --------------------------------------------------

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # --------------------------------------------------
        # JSON error responses
        # --------------------------------------------------

        error_page 404 = @json_404;
        error_page 413 = @json_413;
        error_page 429 = @json_429;
        error_page 502 = @json_502;
        error_page 503 = @json_503;
        error_page 504 = @json_504;

        location @json_404 {
            default_type application/json;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;

            return 404 '{"detail":"Not found"}';
        }

        location @json_413 {
            default_type application/json;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;

            return 413 '{"detail":"Request body too large"}';
        }

        location @json_429 {
            default_type application/json;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;

            return 429 '{"detail":"Too many requests"}';
        }

        location @json_502 {
            default_type application/json;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;

            return 502 '{"detail":"Bad gateway"}';
        }

        location @json_503 {
            default_type application/json;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;

            return 503 '{"detail":"Service unavailable"}';
        }

        location @json_504 {
            default_type application/json;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;

            return 504 '{"detail":"Gateway timeout"}';
        }
    }
}
