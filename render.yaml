services:
  - type: web
    name: modsa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CHROMA_DIR
        value: /app/chroma_db
      - key: CHROMA_COLLECTION
        value: modsa_kmutt
      - key: RAG_SOURCE_PATHS
        value: /app/datasets/chunks
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: RETRIEVAL_K
        value: "4"
      - key: LLM_BASE_URL
        value: https://ollama.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: minimax-m3:cloud
      - key: LLM_TIMEOUT
        value: "30"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: EMBEDDING_BASE_URL
        value: https://api-inference.huggingface.co
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: EMBEDDING_TIMEOUT
        value: "30"
      - key: EMBEDDING_MAX_RETRIES
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
