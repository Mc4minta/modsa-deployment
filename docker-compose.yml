services:
  backend:
    build:
      context: ./backend_new
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      CHROMA_DIR: /app/chroma_db
      RAG_SOURCE_PATHS: /app/storage/chunks
      APP_HOST: 0.0.0.0
      # Inside Docker, host Ollama is reachable via host.docker.internal on Desktop
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend_old/chunks:/app/storage/chunks:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/1.2tongtong
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-45000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
