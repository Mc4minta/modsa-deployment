services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      CHROMA_DIR: /app/chroma_db
      RAG_SOURCE_PATHS: /app/data/chunks
      APP_HOST: 0.0.0.0
    volumes:
      - ./data/chroma:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    # First-boot indexing and heavy imports need headroom; the VM has 16 GB.
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - modsa

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api
    image: modsa-nginx:1.27.3-web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - modsa

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    command: ["http", "--url=https://${NGROK_DOMAIN:-}", "nginx:80"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - modsa

networks:
  modsa:
    name: modsa
    ipam:
      config:
        - subnet: 172.28.0.0/16
